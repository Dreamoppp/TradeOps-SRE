global:
  resolve_timeout: 1m

route:
  group_by: ['alertname', 'service_name']
  group_wait: 5s
  group_interval: 10s
  repeat_interval: 1h
  receiver: "tradeops_webhook"

receivers:
  - name: "tradeops_webhook"
    webhook_configs:
      - url: "http://api:8000/api/alerts/webhook"
        send_resolved: true

